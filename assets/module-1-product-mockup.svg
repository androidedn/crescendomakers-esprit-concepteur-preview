<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Candidat mockup du Module 1 Esprit Concepteur</title>
  <desc id="desc">Composition vectorielle montrant un écran et trois cartes : Observer, Structurer et Expliquer. Elle symbolise le passage d’un problème à une structure claire. Ce fichier reste un candidat en attente de validation visuelle finale.</desc>
  <metadata>Statut : candidat 0.1 — non promu comme Master Mockup.</metadata>
