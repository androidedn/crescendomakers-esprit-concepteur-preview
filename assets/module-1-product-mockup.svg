      <stop offset="0" stop-color="#17365D"/>
      <stop offset="1" stop-color="#2F75B5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17365D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="920" height="720" rx="42" fill="#F4F5F7"/>
  <circle cx="790" cy="112" r="80" fill="#FFF8E2"/>
  <circle cx="116" cy="606" r="54" fill="#EAF3FF"/>

